<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policies</title>
    <style>
        :root {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            background: #f6f4ef;
            color: #1f1f1f;
            line-height: 1.6;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 64px 24px 80px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 400;
            margin: 0 0 12px;
        }

        p {
            margin: 0 0 28px;
            color: #444;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        a {
            color: #1a4f8b;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        li a {
            display: block;
            padding: 16px 18px;
            background: #fff;
            border: 1px solid #e4e0d8;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Privacy Policies</h1>
        <p>Privacy information for apps and games published by Pawel Wedrowski.</p>
        <ul>
            <li>
                <a href="shikaku-brain/">Shikaku Brain</a>
            </li>
        </ul>
    </main>
</body>
</html>
